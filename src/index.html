<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SHAE Browser Drawing - Full-featured drawing app with layers, brushes, and export">
  <title>SHAE Browser Drawing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">SHAE Draw</h1>
        <span class="app-subtitle">Browser Drawing Studio</span>
      </div>
      <div class="header-center">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="brush" title="Brush (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19v2M5 12v7M19 12v7"/></svg></button>
          <button class="tool-btn" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L2 15l9-9 9 9-4 4Z"/><path d="M15 5l-6 6"/></svg></button>
          <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/></svg></button>
          <button class="tool-btn" data-tool="circle" title="Circle (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></button>
          <button class="tool-btn" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg></button>
          <button class="tool-btn" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></button>
        </div>
      </div>
      <div class="header-right">
        <div class="color-picker-group">
          <label class="color-label">Stroke</label>
          <input type="color" id="strokeColor" value="#191712" aria-label="Stroke color">
          <label class="color-label">Fill</label>
          <input type="color" id="fillColor" value="#B3341B" aria-label="Fill color">
        </div>
        <button id="clearBtn" class="btn btn-danger" title="Clear canvas (Ctrl+N)">New</button>
        <button id="exportBtn" class="btn btn-primary" title="Export PNG (Ctrl+S)">Export</button>
      </div>
    </header>

    <main class="app-main">
      <div class="canvas-wrapper">
        <canvas id="drawCanvas" width="1200" height="800" aria-label="Drawing canvas"></canvas>
        <div id="cursorPreview" class="cursor-preview" aria-hidden="true"></div>
      </div>

      <aside class="sidebar">
        <div class="panel-section">
          <h2 class="panel-title">Brush Settings</h2>
          <div class="setting-row">
            <label for="brushSize">Size: <span id="brushSizeValue">8</span>px</label>
            <input type="range" id="brushSize" min="1" max="100" value="8">
          </div>
          <div class="setting-row">
            <label for="brushOpacity">Opacity: <span id="brushOpacityValue">100</span>%</label>
            <input type="range" id="brushOpacity" min="1" max="100" value="100">
          </div>
          <div class="setting-row">
            <label for="brushHardness">Hardness: <span id="brushHardnessValue">50</span>%</label>
            <input type="range" id="brushHardness" min="0" max="100" value="50">
          </div>
          <div class="setting-row">
            <label>
              <input type="checkbox" id="brushSmoothing" checked> Smoothing
            </label>
          </div>
        </div>

        <div class="panel-section">
          <h2 class="panel-title">Layers</h2>
          <div id="layerList" class="layer-list"></div>
          <div class="layer-actions">
            <button id="addLayerBtn" class="btn btn-secondary btn-sm">+ Layer</button>
            <button id="deleteLayerBtn" class="btn btn-danger btn-sm">Delete</button>
          </div>
        </div>

        <div class="panel-section">
          <h2 class="panel-title">History</h2>
          <div id="historyList" class="history-list"></div>
          <div class="history-actions">
            <button id="undoBtn" class="btn btn-secondary btn-sm" title="Undo (Ctrl+Z)">Undo</button>
            <button id="redoBtn" class="btn btn-secondary btn-sm" title="Redo (Ctrl+Y)">Redo</button>
          </div>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <div class="footer-left">
        <span class="shortcut">B</span> Brush &nbsp;
        <span class="shortcut">E</span> Eraser &nbsp;
        <span class="shortcut">R</span> Rect &nbsp;
        <span class="shortcut">C</span> Circle &nbsp;
        <span class="shortcut">L</span> Line &nbsp;
        <span class="shortcut">T</span> Text &nbsp;
        <span class="shortcut">Ctrl+Z</span> Undo &nbsp;
        <span class="shortcut">Ctrl+S</span> Export
      </div>
      <div class="footer-right">
        <a href="https://github.com/spdedsec/shae-javascript-browser-drawing" target="_blank" rel="noopener">View Source</a>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>

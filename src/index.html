<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browser Drawing - Apple HIG drawing and creative canvas studio">
  <meta name="color-scheme" content="light dark">
  <title>Browser Drawing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header" role="banner">
      <div class="header-left">
        <div class="app-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
            <circle cx="11" cy="11" r="2"/>
          </svg>
        </div>
        <h1 class="app-title">Browser Draw</h1>
        <span class="app-subtitle">Studio</span>
      </div>
      <div class="header-center">
        <div class="tool-group" role="toolbar" aria-label="Drawing tools">
          <button class="tool-btn active" data-tool="brush" title="Brush (B)" aria-label="Brush tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19v2M5 12v7M19 12v7"/>
            </svg>
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser (E)" aria-label="Eraser tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 20H7L2 15l9-9 9 9-4 4Z"/>
              <path d="M15 5l-6 6"/>
            </svg>
          </button>
          <button class="tool-btn" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
            </svg>
          </button>
          <button class="tool-btn" data-tool="circle" title="Circle (C)" aria-label="Circle tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
            </svg>
          </button>
          <button class="tool-btn" data-tool="line" title="Line (L)" aria-label="Line tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="19" x2="19" y2="5"/>
            </svg>
          </button>
          <button class="tool-btn" data-tool="text" title="Text (T)" aria-label="Text tool">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V4h16v3"/>
              <path d="M9 20h6"/>
              <path d="M12 4v16"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="color-picker-group">
          <label class="color-label" for="strokeColor">Stroke</label>
          <input type="color" id="strokeColor" value="#007AFF" aria-label="Stroke color">
          <label class="color-label" for="fillColor">Fill</label>
          <input type="color" id="fillColor" value="#34C759" aria-label="Fill color">
        </div>
        <button id="clearBtn" class="btn btn-danger" title="Clear canvas (Ctrl+N)" aria-label="New clear canvas">New</button>
        <button id="exportBtn" class="btn btn-primary" title="Export PNG (Ctrl+S)" aria-label="Export drawing as PNG">Export</button>
      </div>
    </header>

    <main class="app-main" role="main">
      <div class="canvas-wrapper">
        <canvas id="drawCanvas" width="1200" height="800" aria-label="Drawing surface"></canvas>
        <div id="cursorPreview" class="cursor-preview" aria-hidden="true"></div>
      </div>

      <aside class="sidebar" aria-label="Drawing inspector">
        <section class="panel-section">
          <h2 class="panel-title">Brush Settings</h2>
          <div class="setting-row">
            <label for="brushSize">Size: <span id="brushSizeValue">8</span>px</label>
            <input type="range" id="brushSize" min="1" max="100" value="8" aria-label="Brush size">
          </div>
          <div class="setting-row">
            <label for="brushOpacity">Opacity: <span id="brushOpacityValue">100</span>%</label>
            <input type="range" id="brushOpacity" min="1" max="100" value="100" aria-label="Brush opacity">
          </div>
          <div class="setting-row">
            <label for="brushHardness">Hardness: <span id="brushHardnessValue">50</span>%</label>
            <input type="range" id="brushHardness" min="0" max="100" value="50" aria-label="Brush hardness">
          </div>
          <div class="setting-row">
            <label>
              <input type="checkbox" id="brushSmoothing" checked> Smoothing
            </label>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="panel-title">Layers</h2>
          <div id="layerList" class="layer-list" role="list" aria-label="Canvas layers"></div>
          <div class="layer-actions">
            <button id="addLayerBtn" class="btn btn-secondary btn-sm" aria-label="Add layer">+ Layer</button>
            <button id="deleteLayerBtn" class="btn btn-danger btn-sm" aria-label="Delete active layer">Delete</button>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="panel-title">History</h2>
          <div id="historyList" class="history-list" aria-live="polite"></div>
          <div class="history-actions">
            <button id="undoBtn" class="btn btn-secondary btn-sm" title="Undo (Ctrl+Z)" aria-label="Undo action">Undo</button>
            <button id="redoBtn" class="btn btn-secondary btn-sm" title="Redo (Ctrl+Y)" aria-label="Redo action">Redo</button>
          </div>
        </section>
      </aside>
    </main>

    <footer class="app-footer" role="contentinfo">
      <div class="footer-left">
        <span class="shortcut">B</span> Brush &nbsp;
        <span class="shortcut">E</span> Eraser &nbsp;
        <span class="shortcut">R</span> Rect &nbsp;
        <span class="shortcut">C</span> Circle &nbsp;
        <span class="shortcut">L</span> Line &nbsp;
        <span class="shortcut">T</span> Text &nbsp;
        <span class="shortcut">Ctrl+Z</span> Undo &nbsp;
        <span class="shortcut">Ctrl+S</span> Export
      </div>
      <div class="footer-right">
        <a href="https://github.com/spdedsec/shae-javascript-browser-drawing" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
